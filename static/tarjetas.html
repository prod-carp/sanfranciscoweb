<body>

  <div class="cards-grid" id="newsGrid"></div>

  <script>
    (function() {
      // Datos del JSON (tal cual se proporcionan)
      const newsData = [
        {
          "category": "Oraciones",
          "title": "El Santo Rosario: una de las oraciones más queridas y poderosas",
          "subtitle": "Guía completa y detallada para que puedas rezar el Santo Rosario con toda la devoción que merece",
          "date": "2026-04-02",
          "image": "https://sanfranciscoysantaclara.es/assets/images//assets/images/rezorosario-meta.webp",
          "url": "/noticias/rezar-el-rosario/"
        },
        {
          "category": "Parroquia",
          "title": "Colecta solidaria en la parroquia para Venezuela",
          "subtitle": "La parroquia de San Francisco y Santa Clara organiza una colecta solidaria para apoyar a los afectados por el terremoto en Caracas a través de Cáritas Venezuela.",
          "date": "2026-06-30",
          "image": "https://sanfranciscoysantaclara.es/assets/images//assets/images/blog/colecta-venezuela.webp",
          "url": "/noticias/colecta-solidaria-venezuela/"
        },
        {
          "category": "Peregrinaciones",
          "title": "Un día inolvidable junto al Papa León: crónica de una jornada de fe en Madrid",
          "subtitle": "Así vivimos la celebración de la Santa Misa presidida por el Papa León en Madrid, una jornada marcada por la fe, y la alegría ser parte de la Iglesia universal.",
          "date": "2026-06-07",
          "image": "https://sanfranciscoysantaclara.es/assets/images//assets/images/blog/visitapapa.webp",
          "url": "/noticias/visita-papa-leon/"
        },
        {
          "category": "Testimonios",
          "title": "Una guitarra, una cabasa y mucha ilusión: nuestra experiencia en el coro de niños",
          "subtitle": "Así comenzó nuestra pequeña aventura en el coro de niños de la parroquia durante este final de temporada de comuniones de 2026",
          "date": "2026-05-31",
          "image": "https://sanfranciscoysantaclara.es/assets/images//assets/images/coro-peque.webp",
          "url": "/noticias/experiencia-coro/"
        }
      ];

      const grid = document.getElementById('newsGrid');

      // Función para formatear fecha (opcional, se muestra tal cual, pero podemos dejarla legible)
      function formatDate(dateStr) {
        const date = new Date(dateStr);
        return date.toLocaleDateString('es-ES', {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });
      }

      // Construir cada tarjeta
      newsData.forEach(item => {
        const card = document.createElement('article');
        card.className = 'news-card';

        // Imagen (cuadrada)
        const img = document.createElement('img');
        img.className = 'card-image';
        img.src = item.image;
        img.alt = item.title;
        img.loading = 'lazy';
        // Si la imagen no carga, mostramos un color de fondo
        img.onerror = function() {
          this.style.background = '#d1d5db';
        };

        // Contenedor de contenido
        const content = document.createElement('div');
        content.className = 'card-content';

        // Fecha
        const dateEl = document.createElement('p');
        dateEl.className = 'card-date';
        dateEl.textContent = formatDate(item.date); // o usar item.date directamente si se prefiere formato raw

        // Título (negrita)
        const titleEl = document.createElement('h3');
        titleEl.className = 'card-title';
        titleEl.textContent = item.title;

        // Subtítulo (con límite de 130 caracteres)
        const subtitleEl = document.createElement('p');
        subtitleEl.className = 'card-subtitle';
        // Recortar a 130 caracteres si es más largo, y añadir "…" (opcional, pero CSS ya limita con ellipsis)
        let subtitleText = item.subtitle;
        if (subtitleText.length > 130) {
          subtitleText = subtitleText.slice(0, 130) + '…';
        }
        subtitleEl.textContent = subtitleText;

        // Montar la tarjeta
        content.appendChild(dateEl);
        content.appendChild(titleEl);
        content.appendChild(subtitleEl);

        card.appendChild(img);
        card.appendChild(content);

        // (Opcional) hacer clic en la tarjeta para ir a la URL
        card.addEventListener('click', function() {
          window.location.href = item.url;
        });
        // Añadir cursor pointer para indicar que es clickeable
        card.style.cursor = 'pointer';

        grid.appendChild(card);
      });

      // Nota: el límite de 130 caracteres también se aplica mediante CSS con line-clamp
      // pero añadimos el recorte en JS por si el texto es muy largo y el ellipsis no es suficiente.
      // De todas formas, el CSS con -webkit-line-clamp:3 y max-height controla el desbordamiento.
    })();
  </script>
