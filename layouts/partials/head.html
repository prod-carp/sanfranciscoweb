<head>

  <meta charset="UTF-8">
  <link rel="canonical" href="{{ .Permalink | absURL }}">  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta name="description" content="{{ if .Params.subtitle }}{{ .Params.subtitle }}{{ else }}Parroquia San Francisco y Santa Clara de Asís en Fuenlabrada{{ end }}">
  <meta name="theme-color" content="#ffffff">
  <meta name="author" content="Parroquia San Francisco y Santa Clara de Asís">
  
<title>
{{ if .IsHome }}
Parroquia San Francisco y Santa Clara de Asís | Fuenlabrada
{{ else }}
{{ .Title }} | Parroquia San Francisco y Santa Clara de Asís
{{ end }}
</title>

{{ if .IsHome }}
  <!-- HOME -->
  <meta property="og:type" content="website">
{{ else if eq .Kind "page" }}
  <!-- CONTENIDO DE NOTICIA -->
  <meta property="og:type" content="article">
  <!-- Schema.org Church -->
{{ $image := default "/assets/images/index-meta-1200x630.webp" .Params.image }}
{{ $description := default .Title .Params.subtitle }}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "NewsArticle"

  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink | absURL }}"
  },

  "headline": "{{ .Title }}",
  "description": "{{ $description }}",
  "image": "{{ $image | absURL }}",

  "author": {
    "@type": "Organization",
    "name": "Parroquia San Francisco y Santa Clara de Asís",
    "url": "https://sanfranciscoysantaclara.es"
  },

  "publisher": {
    "@type": "Organization",
    "name": "Parroquia San Francisco y Santa Clara de Asís",
    "url": "https://sanfranciscoysantaclara.es",
    "logo": {
      "@type": "ImageObject",
      "url": "https://sanfranciscoysantaclara.es/assets/images/logo.png"
    }
  },

  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",

  "inLanguage": "es-ES",
  "url": "{{ .Permalink | absURL }}"
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Inicio",
      "item": "https://sanfranciscoysantaclara.es/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Noticias",
      "item": "https://sanfranciscoysantaclara.es/noticias/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "{{ index .Params.categorias 0 }}",
      "item": "https://sanfranciscoysantaclara.es/categorias/{{ index .Params.categorias 0 | urlize }}"
    },
    {
      "@type": "ListItem",
      "position": 4,
      "name": "{{ .Title }}",
      "item": "{{ .Permalink }}"
    }
  ]
}
</script>
{{ else if eq .Kind "section" }}
<!-- LISTA DE NOTICIAS -->

  <meta property="og:type" content="website">

  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",

  "name": "{{ .Title }}",
  "description": "Noticias y actualidad de la Parroquia San Francisco y Santa Clara de Asís",

  "url": "{{ .Permalink | absURL }}",

  "isPartOf": {
    "@type": "WebSite",
    "name": "Parroquia San Francisco y Santa Clara de Asís",
    "url": "https://sanfranciscoysantaclara.es"
  },

  "mainEntity": {
    "@type": "ItemList",
    "name": "Últimas noticias",
    "numberOfItems": {{ len .Pages }},

    "itemListElement": [
      {{- $pages := first 9 .Pages -}}
      {{- range $index, $page := $pages -}}
      {
        "@type": "ListItem",
        "position": {{ add $index 1 }},
        "url": "{{ $page.Permalink | absURL }}",
        "name": "{{ $page.Title }}",
        "image": "{{ $page.Params.image | absURL }}"
      }{{ if lt (add $index 1) (len $pages) }},{{ end }}
      {{- end -}}
    ]
  }
}
</script>

{{ else if eq .Kind "taxonomy" }}

  <!-- TAXONOMÍAS (NOTICIAS ORGANIZADAS POR TEMAS) -->
  <meta property="og:type" content="website">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",

  "name": "{{ .Title }}",
  "description": "Explora las noticias y publicaciones de la parroquia organizadas por temática.",

  "url": "{{ .Permalink | absURL }}",

  "mainEntity": {
    "@type": "ItemList",
    "name": "Categorías",
    "numberOfItems": {{ len .Pages }},
    "itemListElement": [
      {{ range $i, $page := .Pages }}
      {
        "@type": "ListItem",
        "position": {{ add $i 1 }},
        "name": "{{ $page.Title }}",
	"description": "Noticias y publicaciones relacionadas con {{ $page.Title }}.",
        "url": "{{ $page.Permalink | absURL }}"
      }{{ if ne (add $i 1) (len $.Pages) }},{{ end }}
      {{ end }}
    ]
  }
}
</script>

{{ else if eq .Kind "term" }}
<!-- LISTA DE NOTICIAS DE TEMATICA -->
<meta property="og:type" content="website">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",

  "name": "{{ .Title }}",
  "description": "Noticias y publicaciones relacionadas con {{ .Title }}.",

  "url": "{{ .Permalink | absURL }}",

  "mainEntity": {
    "@type": "ItemList",
    "name": "{{ .Title }}",
    "numberOfItems": {{ len .Pages }},

    "itemListElement": [
      {{ range $i, $page := .Pages }}
      {
        "@type": "ListItem",
        "position": {{ add $i 1 }},

        "item": {
          "@type": "NewsArticle"
          "headline": "{{ $page.Title }}",
          "description": "{{ $page.Params.subtitle }}",
          "url": "{{ $page.Permalink | absURL }}",
          "datePublished": "{{ $page.Date.Format "2006-01-02T15:04:05-07:00" }}",
          "image": "{{ $page.Params.image }}"
        }
      }{{ if ne (add $i 1) (len $.Pages) }},{{ end }}
      {{ end }}
    ]
  }
}
</script>


{{ end }}
