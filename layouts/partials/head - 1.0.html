<head>

  <meta charset="UTF-8">
  <link rel="canonical" href="{{ .Permalink | absURL }}">  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  <meta name="description" content="{{ .Title }}. {{ .Params.subtitle }}">
  <meta name="theme-color" content="#ffffff">
  <meta name="author" content="Parroquia San Francisco y Santa Clara de Asís">
  
<title>
{{ if .IsHome }}
Parroquia San Francisco y Santa Clara de Asís | Fuenlabrada
{{ else }}
{{ .Title }} | Parroquia San Francisco y Santa Clara de Asís
{{ end }}
</title>

<meta property="og:type" content="article">
<meta property="og:site_name" content="Parroquia San Francisco y Santa Clara de Asís">
<meta property="og:title" content="{{ .Title }} | Parroquia San Francisco y Santa Clara de Asís">
<meta property="og:description" content="{{ .Title }}. {{ .Params.subtitle }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ .Params.image }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title }} | Parroquia San Francisco y Santa Clara de Asís">
<meta name="twitter:description" content="{{ .Title }}. {{ .Params.subtitle }}">
<meta name="twitter:image" content="{{ .Params.image }}">

<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png">

<!-- Schema.org Church -->
{{ $image := default "https://sanfranciscoysantaclara.es/assets/images/index-meta-1200x630.webp" .Params.image }}
{{ $description := default .Title .Params.subtitle }}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",

  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink | absURL }}"
  },

  "headline": "{{ .Title }}",
  "description": "{{ $description }}",
  "image": "{{ $image }}",

  "author": {
    "@type": "Organization",
    "name": "Parroquia San Francisco y Santa Clara de Asís"
  },

  "publisher": {
    "@type": "Organization",
    "name": "Parroquia San Francisco y Santa Clara de Asís",
    "logo": {
      "@type": "ImageObject",
      "url": "https://sanfranciscoysantaclara.es/assets/images/index-meta-1200x630.webp"
    }
  },

  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",

  "inLanguage": "es-ES",
  "url": "{{ .Permalink | absURL }}"
}
</script>
