{{ define "main" }}
{{ partial "breadcrumb.html" . }}
<section class="container">
  <h1>{{ .Title }}</h1>
  <p><small>{{ .Date.Format "02/01/2006" }}</small></p>

  {{ with .Description }}
  <p class="post-description">{{ . }}</p>
  {{ end }}

  <div>
    {{ .Content }}
  </div>
</section>

{{ end }}

.post-description {
    font-size: 1.15rem;
    color: #666;
    margin-top: 0.5rem;
    margin-bottom: 1.5rem;
    font-style: italic;
}
