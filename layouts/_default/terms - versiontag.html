{{ define "main" }}

{{ partial "breadcrumb.html" . }}

<div class="container">
  <h1 class="mbr-section-title mbr-fonts-style align-center mb-2 display-2">
    <strong>Todas las categorías</strong>
  </h1>
  
  <p class="text-center mb-5" style="color: #666; font-size: 1.1rem;">
    📚 Explora todas las categorías de nuestro blog
  </p>
  
  <div class="row mt-4">
    {{ range $index, $category := .Data.Terms.Alphabetical }}
      <div class="category-card-col col-12 col-sm-6 col-md-4 col-lg-3 mb-4" data-index="{{ $index }}">
        <a href="{{ .Page.RelPermalink }}" class="category-card-link" style="text-decoration: none;">
          <div class="category-card">
            <div class="card-gradient-bg"></div>
            
            <h3 class="category-name">
              {{ .Page.Title }}
            </h3>
            
            <p class="category-count">
              📄 {{ .Count }} artículo{{ if ne .Count 1 }}s{{ end }}
            </p>
            
            <div class="category-icon">
              🏷️
            </div>
          </div>
        </a>
      </div>
    {{ end }}
  </div>
</div>

<style>
.category-card {
  position: relative;
  border-radius: 16px;
  padding: 30px 20px;
  text-align: center;
  color: white;
  transition: all 0.3s ease;
  height: 100%;
  min-height: 200px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  overflow: hidden;
  cursor: pointer;
}

.card-gradient-bg {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 0;
  transition: all 0.3s ease;
}

/* Colores degradados para cada categoría usando nth-child */
.category-card-col:nth-child(12n+1) .card-gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.category-card-col:nth-child(12n+2) .card-gradient-bg { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
.category-card-col:nth-child(12n+3) .card-gradient-bg { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
.category-card-col:nth-child(12n+4) .card-gradient-bg { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
.category-card-col:nth-child(12n+5) .card-gradient-bg { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
.category-card-col:nth-child(12n+6) .card-gradient-bg { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }
.category-card-col:nth-child(12n+7) .card-gradient-bg { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
.category-card-col:nth-child(12n+8) .card-gradient-bg { background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); }
.category-card-col:nth-child(12n+9) .card-gradient-bg { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); }
.category-card-col:nth-child(12n+10) .card-gradient-bg { background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%); }
.category-card-col:nth-child(12n+11) .card-gradient-bg { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }
.category-card-col:nth-child(12n+12) .card-gradient-bg { background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); }

.category-name {
  font-size: 1.8rem;
  font-weight: bold;
  margin-bottom: 15px;
  position: relative;
  z-index: 1;
  word-break: break-word;
}

.category-count {
  font-size: 1rem;
  margin: 0;
  opacity: 0.9;
  position: relative;
  z-index: 1;
}

.category-icon {
  position: absolute;
  bottom: 10px;
  right: 15px;
  font-size: 3rem;
  opacity: 0.15;
  z-index: 1;
}

.category-card-link:hover .category-card {
  transform: translateY(-8px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.15);
}

.category-card-link:hover .card-gradient-bg {
  filter: brightness(1.05) saturate(1.1);
}

.category-card {
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
}

@media (max-width: 768px) {
  .category-card {
    padding: 20px 15px !important;
    min-height: 160px !important;
  }
  
  .category-name {
    font-size: 1.4rem !important;
  }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.category-card-col {
  animation: fadeInUp 0.4s ease-out forwards;
  opacity: 0;
}

.category-card-col:nth-child(1) { animation-delay: 0.05s; }
.category-card-col:nth-child(2) { animation-delay: 0.10s; }
.category-card-col:nth-child(3) { animation-delay: 0.15s; }
.category-card-col:nth-child(4) { animation-delay: 0.20s; }
.category-card-col:nth-child(5) { animation-delay: 0.25s; }
.category-card-col:nth-child(6) { animation-delay: 0.30s; }
.category-card-col:nth-child(7) { animation-delay: 0.35s; }
.category-card-col:nth-child(8) { animation-delay: 0.40s; }
.category-card-col:nth-child(9) { animation-delay: 0.45s; }
.category-card-col:nth-child(10) { animation-delay: 0.50s; }
.category-card-col:nth-child(11) { animation-delay: 0.55s; }
.category-card-col:nth-child(12) { animation-delay: 0.60s; }
</style>

{{ end }}
