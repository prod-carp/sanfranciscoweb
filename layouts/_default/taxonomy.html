{{ define "main" }}
<div class="container">
  <h1>Categoría: {{ .Title }}</h1>
  <p>Encontrados {{ len .Pages }} artículos</p>
  
  <div class="posts-list">
    {{ range .Pages }}
      <article class="post-item">
        <h2>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </h2>
        <div class="post-meta">
          <time>{{ .Date.Format "2006-01-02" }}</time>
        </div>
        <p>{{ .Summary }}</p>
      </article>
    {{ end }}
  </div>
  
  <!-- Paginación opcional -->
  {{ template "_internal/pagination.html" . }}
</div>
{{ end }}
