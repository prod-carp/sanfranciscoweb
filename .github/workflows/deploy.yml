name: Deploy Hugo to Firebase

on:
  push:
    branches:
      - main

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.159.2'
          extended: true

      - name: Generar sitio Hugo
        run: hugo

      - name: Instalar Firebase CLI
        run: |
          npm install -g firebase-tools
          echo "Firebase CLI version:"
          firebase --version

      - name: Autenticación Firebase (Service Account)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/firebase-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json" >> $GITHUB_ENV

      - name: Deploy a Firebase
        run: firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy a Firebase (con reintentos)
        run: |
          for i in 1 2 3; do
            echo "Intento $i de deploy..."
            firebase deploy --only hosting --non-interactive && exit 0
            echo "Falló intento $i, reintentando..."
            sleep 10
          done

          echo "Deploy fallido tras 3 intentos"
          exit 1
