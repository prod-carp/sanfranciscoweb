name: Comprobar noticias para publicación

on:
  schedule:
    - cron: "0 3 * * *" 

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:

  comprobar-noticias:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # BUSCAR PR DE NOTICIAS (SIN RESTRICCIÓN DE HORA)
      # ==========================================================

      - name: Buscar PR de noticias
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

        run: |

          # ==========================================================
          # CONFIGURAR MANEJO DE ERRORES
          # ==========================================================

          set -e
          set -o pipefail

          echo "========================================"
          echo " COMPROBACIÓN DE NOTICIAS"
          echo "========================================"

          echo ""
          echo "🕒 Hora de ejecución: $(date)"

          # ==========================================================
          # LISTAR PRs
          # ==========================================================

          PRS=$(gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --base main \
            --json number,headRefName,isDraft,title \
            --limit 100)

          if [ "$PRS" = "[]" ]; then
            echo "No hay Pull Requests abiertos."
            exit 0
          fi

          # ==========================================================
          # PROCESAR PRs
          # ==========================================================

          TEMP_FILE=$(mktemp)

          # Limpiar el archivo temporal incluso si el script falla
          trap 'rm -f "$TEMP_FILE"' EXIT

          echo "$PRS" | jq -c '.[]' > "$TEMP_FILE"

          while read -r PR; do

            NUMBER=$(echo "$PR" | jq -r '.number')
            BRANCH=$(echo "$PR" | jq -r '.headRefName')
            IS_DRAFT=$(echo "$PR" | jq -r '.isDraft')
            TITLE=$(echo "$PR" | jq -r '.title')

            echo ""
            echo "----------------------------------------"
            echo "PR #$NUMBER"
            echo "Título: $TITLE"
            echo "Rama: $BRANCH"
            echo "Draft: $IS_DRAFT"
            echo "----------------------------------------"

            # ==================================================
            # COMPROBAR RAMA
            # ==================================================

            if [[ "$BRANCH" != noticia/* ]]; then

              echo "→ Se omite: no es una rama noticia/."

              continue

            fi

            # ==================================================
            # COMPROBAR DRAFT
            # ==================================================

            if [ "$IS_DRAFT" = "true" ]; then

              echo "→ Se omite: el PR está en Draft."

              continue

            fi

            # ==================================================
            # COMPROBAR MERGEABLE
            # ==================================================

            MERGEABLE="UNKNOWN"

            for INTENTO in 1 2 3 4 5; do

              MERGEABLE=$(gh pr view "$NUMBER" \
                --repo "$GH_REPO" \
                --json mergeable \
                --jq '.mergeable')

              echo "Intento $INTENTO/5 → Mergeable: $MERGEABLE"

              if [ "$MERGEABLE" != "UNKNOWN" ]; then
                break
              fi

              if [ "$INTENTO" -lt 5 ]; then

                echo "GitHub todavía no ha calculado la mergeabilidad."
                echo "Esperando 10 segundos..."

                sleep 10

              fi

            done

            echo ""

            # ==================================================
            # RESULTADO
            # ==================================================

            if [ "$MERGEABLE" = "MERGEABLE" ]; then

              echo "✅ PR #$NUMBER está preparado para publicación."

            elif [ "$MERGEABLE" = "CONFLICTING" ]; then

              echo "❌ PR #$NUMBER tiene conflictos."
              echo "→ Se omite. No se realizará ningún merge."

            else

              echo "⚠ PR #$NUMBER continúa con estado: $MERGEABLE"
              echo "→ Se omite por seguridad."

            fi

          done < "$TEMP_FILE"

          echo ""
          echo "========================================"
          echo " FIN DE LA COMPROBACIÓN"
          echo "========================================"