name: Comprobar noticias para publicación

on:
  schedule:
    - cron: "0 3 * * *" 

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:

  comprobar-noticias:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # BUSCAR PR DE NOTICIAS (SIN RESTRICCIÓN DE HORA)
      # ==========================================================

      - name: Buscar PR de noticias
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

        run: |

          echo "========================================"
          echo " COMPROBACIÓN DE NOTICIAS"
          echo "========================================"

          echo ""
          echo "🕒 Hora de ejecución: $(date)"

          PRS=$(gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --base main \
            --json number,headRefName,isDraft,title \
            --limit 100)

          echo "$PRS"

          echo ""

          if [ "$PRS" = "[]" ]; then
            echo "No hay Pull Requests abiertos."
            exit 0
          fi

          echo "$PRS" |
          jq -c '.[]' |
          while read -r PR; do

            NUMBER=$(echo "$PR" | jq -r '.number')
            BRANCH=$(echo "$PR" | jq -r '.headRefName')
            IS_DRAFT=$(echo "$PR" | jq -r '.isDraft')
            TITLE=$(echo "$PR" | jq -r '.title')

            echo ""
            echo "----------------------------------------"
            echo "PR #$NUMBER"
            echo "Título: $TITLE"
            echo "Rama: $BRANCH"
            echo "Draft: $IS_DRAFT"
            echo "----------------------------------------"

            if [[ "$BRANCH" != noticia/* ]]; then
              echo "→ Se omite: no es una rama noticia/."
              continue
            fi

            if [ "$IS_DRAFT" = "true" ]; then
              echo "→ Se omite: el PR está en Draft."
              continue
            fi

            # ==================================================
            # COMPROBAR MERGEABLE
            # ==================================================

            MERGEABLE="UNKNOWN"

            for INTENTO in 1 2 3 4 5; do

              MERGEABLE=$(gh pr view "$NUMBER" \
                --repo "$GH_REPO" \
                --json mergeable \
                --jq '.mergeable')

              echo "Intento $INTENTO/5 → Mergeable: $MERGEABLE"

              if [ "$MERGEABLE" != "UNKNOWN" ]; then
                break
              fi

              if [ "$INTENTO" -lt 5 ]; then
                echo "GitHub todavía no ha calculado la mergeabilidad."
                echo "Esperando 10 segundos..."
                sleep 10
              fi

            done

            echo ""

            if [ "$MERGEABLE" = "MERGEABLE" ]; then
              echo "✅ PR #$NUMBER está preparado para publicación."
            elif [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "❌ PR #$NUMBER tiene conflictos."
            else
              echo "⚠ PR #$NUMBER continúa con estado: $MERGEABLE"
            fi

          done

          echo ""
          echo "========================================"
          echo " FIN DE LA COMPROBACIÓN"
          echo "========================================"


      # ==========================================================
      # BUSCAR PR DE NOTICIAS
      # ==========================================================

      - name: Buscar PR de noticias
        if: steps.hora.outputs.ejecutar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

        run: |

          echo "========================================"
          echo " COMPROBACIÓN DE NOTICIAS"
          echo "========================================"

          echo ""

          PRS=$(gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --base main \
            --json number,headRefName,isDraft,title \
            --limit 100)

          echo "$PRS"

          echo ""


          if [ "$PRS" = "[]" ]; then

            echo "No hay Pull Requests abiertos."

            exit 0

          fi


          echo "$PRS" |
          jq -c '.[]' |
          while read -r PR; do

            NUMBER=$(echo "$PR" | jq -r '.number')
            BRANCH=$(echo "$PR" | jq -r '.headRefName')
            IS_DRAFT=$(echo "$PR" | jq -r '.isDraft')
            TITLE=$(echo "$PR" | jq -r '.title')


            echo ""
            echo "----------------------------------------"
            echo "PR #$NUMBER"
            echo "Título: $TITLE"
            echo "Rama: $BRANCH"
            echo "Draft: $IS_DRAFT"
            echo "----------------------------------------"


            # ==================================================
            # COMPROBAR RAMA
            # ==================================================

            if [[ "$BRANCH" != noticia/* ]]; then

              echo "→ Se omite: no es una rama noticia/."

              continue

            fi


            # ==================================================
            # COMPROBAR DRAFT
            # ==================================================

            if [ "$IS_DRAFT" = "true" ]; then

              echo "→ Se omite: el PR está en Draft."

              continue

            fi


            # ==================================================
            # COMPROBAR MERGEABLE
            #
            # GitHub puede devolver UNKNOWN mientras calcula
            # la posibilidad de hacer merge.
            #
            # Hacemos hasta 5 intentos, esperando 10 segundos
            # entre cada uno.
            # ==================================================

            MERGEABLE="UNKNOWN"

            for INTENTO in 1 2 3 4 5; do

              MERGEABLE=$(gh pr view "$NUMBER" \
                --repo "$GH_REPO" \
                --json mergeable \
                --jq '.mergeable')

              echo "Intento $INTENTO/5 → Mergeable: $MERGEABLE"


              if [ "$MERGEABLE" != "UNKNOWN" ]; then

                break

              fi


              if [ "$INTENTO" -lt 5 ]; then

                echo "GitHub todavía no ha calculado la mergeabilidad."
                echo "Esperando 10 segundos antes de volver a consultar..."

                sleep 10

              fi

            done


            echo ""


            # ==================================================
            # RESULTADO FINAL DE MERGEABILIDAD
            # ==================================================

            if [ "$MERGEABLE" = "MERGEABLE" ]; then

              echo "✓ PR #$NUMBER está preparado para publicación."

            elif [ "$MERGEABLE" = "CONFLICTING" ]; then

              echo "✗ PR #$NUMBER tiene conflictos."
              echo "→ Se omite y NO se realizará ningún merge."

            else

              echo "⚠ PR #$NUMBER continúa con estado: $MERGEABLE"
              echo "→ No se realizará ningún merge por seguridad."

            fi


          done


          echo ""
          echo "========================================"
          echo " FIN DE LA COMPROBACIÓN"
          echo "========================================"