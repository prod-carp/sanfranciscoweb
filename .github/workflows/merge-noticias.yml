name: Publicar noticias

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      verificar_pr:
        description: 'Número de PR ya fusionado para verificar (opcional)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:

  publicar:
    runs-on: ubuntu-latest

    steps:


      # ==========================================================
      # PROCESAR PR
      # ==========================================================

      - name: Fusionar y verificar publicaciones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: prod-carp/sanfranciscoweb
        run: |

          set -e
          set -o pipefail

          TEMP_FILE=$(mktemp)

          trap 'rm -f "$TEMP_FILE"' EXIT


          # ========================================================
          # MODO MANUAL:
          # verificar un PR ya fusionado
          # ========================================================

          if [ -n "${{ inputs.verificar_pr }}" ]; then

            NUMBER="${{ inputs.verificar_pr }}"

            echo ""
            echo "=========================================="
            echo "VERIFICACIÓN MANUAL"
            echo "PR #$NUMBER"
            echo "=========================================="
            echo ""

            STATE=$(gh pr view "$NUMBER" \
              --repo "$GH_REPO" \
              --json state \
              --jq '.state')

            if [ "$STATE" != "MERGED" ]; then

              echo "❌ El PR #$NUMBER no está fusionado."
              echo "Estado actual: $STATE"

              exit 1

            fi


            # ------------------------------------------------------
            # Obtener archivos del PR
            # ------------------------------------------------------

            FILES=$(gh api \
              "repos/$GH_REPO/pulls/$NUMBER/files" \
              --paginate \
              --jq '.[].filename')


            MARKDOWN_PATH=$(echo "$FILES" |
              awk '/^content\/noticias\/.*\.md$/ {print; exit}')


            IMAGE_PATH=$(echo "$FILES" |
              awk '/^static\/assets\/images\/blog\// {print; exit}')


            if [ -z "$MARKDOWN_PATH" ]; then

              echo "❌ No se encontró el Markdown del artículo."

              exit 1

            fi


            if [ -z "$IMAGE_PATH" ]; then

              echo "❌ No se encontró la imagen del artículo."

              exit 1

            fi


            echo "Markdown:"
            echo "  $MARKDOWN_PATH"

            echo ""

            echo "Imagen:"
            echo "  $IMAGE_PATH"

            echo ""


            # ------------------------------------------------------
            # Obtener commit de merge
            # ------------------------------------------------------

            MERGE_SHA=$(gh pr view "$NUMBER" \
              --repo "$GH_REPO" \
              --json mergeCommit \
              --jq '.mergeCommit.oid')


            if [ -z "$MERGE_SHA" ] || [ "$MERGE_SHA" = "null" ]; then

              echo "❌ No se ha podido obtener el commit de merge."

              exit 1

            fi


            echo "Commit de merge:"
            echo "  $MERGE_SHA"

            echo ""


            # ------------------------------------------------------
            # Verificar Markdown
            # ------------------------------------------------------

            if gh api \
              "repos/$GH_REPO/contents/$MARKDOWN_PATH?ref=$MERGE_SHA" \
              >/dev/null; then

              echo "✓ Markdown localizado en main."

            else

              echo "❌ El Markdown NO se encuentra en main."

              exit 1

            fi


            # ------------------------------------------------------
            # Verificar imagen
            # ------------------------------------------------------

            if gh api \
              "repos/$GH_REPO/contents/$IMAGE_PATH?ref=$MERGE_SHA" \
              >/dev/null; then

              echo "✓ Imagen localizada en main."

            else

              echo "❌ La imagen NO se encuentra en main."

              exit 1

            fi


            echo ""
            echo "=========================================="
            echo "✓ PUBLICACIÓN CONFIRMADA"
            echo "=========================================="
            echo ""

            echo "PR: #$NUMBER"
            echo "Commit: $MERGE_SHA"
            echo "Markdown: OK"
            echo "Imagen: OK"

            echo ""

            echo "⚠ D1 y R2 todavía NO se modifican."

            exit 0

          fi


          # ========================================================
          # MODO AUTOMÁTICO
          # ========================================================

          echo ""
          echo "=========================================="
          echo "BUSCANDO PR ABIERTOS"
          echo "=========================================="
          echo ""


          gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --base main \
            --json number,headRefName,isDraft,title \
            --jq '.[] | [
              .number,
              .headRefName,
              .isDraft,
              .title
            ] | @tsv' > "$TEMP_FILE"


          if [ ! -s "$TEMP_FILE" ]; then

            echo "No hay PR abiertos para publicar."

            exit 0

          fi


          while IFS=$'\t' read -r NUMBER BRANCH DRAFT TITLE
          do

            echo ""
            echo "------------------------------------------"
            echo "PR #$NUMBER"
            echo "Título: $TITLE"
            echo "Rama: $BRANCH"
            echo "------------------------------------------"


            # ------------------------------------------------------
            # Solo ramas noticia/*
            # ------------------------------------------------------

            if [[ "$BRANCH" != noticia/* ]]; then

              echo "→ No es una rama de noticia. Se omite."

              continue

            fi


            # ------------------------------------------------------
            # No fusionar Draft
            # ------------------------------------------------------

            if [ "$DRAFT" = "true" ]; then

              echo "→ El PR está marcado como Draft. Se omite."

              continue

            fi


            # ------------------------------------------------------
            # Obtener archivos ANTES del merge
            # ------------------------------------------------------

            FILES=$(gh api \
              "repos/$GH_REPO/pulls/$NUMBER/files" \
              --paginate \
              --jq '.[].filename')


            MARKDOWN_PATH=$(echo "$FILES" |
              awk '/^content\/noticias\/.*\.md$/ {print; exit}')


            IMAGE_PATH=$(echo "$FILES" |
              awk '/^static\/assets\/images\/blog\// {print; exit}')


            if [ -z "$MARKDOWN_PATH" ]; then

              echo "❌ No se encontró el Markdown."

              continue

            fi


            if [ -z "$IMAGE_PATH" ]; then

              echo "❌ No se encontró la imagen."

              continue

            fi


            echo "Markdown:"
            echo "  $MARKDOWN_PATH"

            echo ""

            echo "Imagen:"
            echo "  $IMAGE_PATH"


            # ------------------------------------------------------
            # Comprobar mergeabilidad
            # ------------------------------------------------------

            MERGEABLE="UNKNOWN"

            ATTEMPT=1


            while [ "$ATTEMPT" -le 5 ]
            do

              echo ""
              echo "Comprobación de mergeabilidad $ATTEMPT/5..."


              MERGEABLE=$(gh pr view "$NUMBER" \
                --repo "$GH_REPO" \
                --json mergeable \
                --jq '.mergeable')


              echo "Estado: $MERGEABLE"


              if [ "$MERGEABLE" != "UNKNOWN" ]; then

                break

              fi


              if [ "$ATTEMPT" -lt 5 ]; then

                echo "GitHub todavía está calculando..."
                echo "Esperando 10 segundos..."

                sleep 10

              fi


              ATTEMPT=$((ATTEMPT + 1))

            done


            # ------------------------------------------------------
            # Conflicto
            # ------------------------------------------------------

            if [ "$MERGEABLE" = "CONFLICTING" ]; then

              echo "⚠ El PR tiene conflictos."
              echo "→ Se deja abierto."

              continue

            fi


            # ------------------------------------------------------
            # UNKNOWN definitivo
            # ------------------------------------------------------

            if [ "$MERGEABLE" = "UNKNOWN" ]; then

              echo "⚠ GitHub no ha podido determinar la mergeabilidad."
              echo "→ Se deja abierto."

              continue

            fi


            # ------------------------------------------------------
            # Solo fusionar MERGEABLE
            # ------------------------------------------------------

            if [ "$MERGEABLE" != "MERGEABLE" ]; then

              echo "⚠ Estado no esperado: $MERGEABLE"
              echo "→ Se deja abierto."

              continue

            fi


            echo ""
            echo "✓ PR preparado para fusionarse."


            # ======================================================
            # MERGE REAL
            # ======================================================

            if gh pr merge "$NUMBER" \
              --repo "$GH_REPO" \
              --merge \
              --delete-branch; then

              echo ""
              echo "✅ PR #$NUMBER fusionado correctamente."

            else

              echo ""
              echo "❌ No se ha podido fusionar el PR #$NUMBER."
              echo "→ El PR permanecerá abierto."

              continue

            fi


            # ======================================================
            # OBTENER COMMIT DE MERGE
            # ======================================================

            MERGE_SHA=$(gh pr view "$NUMBER" \
              --repo "$GH_REPO" \
              --json mergeCommit \
              --jq '.mergeCommit.oid')


            if [ -z "$MERGE_SHA" ] || [ "$MERGE_SHA" = "null" ]; then

              echo "❌ El PR se fusionó, pero no se pudo localizar el commit."

              exit 1

            fi


            echo ""
            echo "Commit de merge:"
            echo "  $MERGE_SHA"


            # ======================================================
            # VERIFICAR MARKDOWN EN MAIN
            # ======================================================

            echo ""
            echo "Verificando Markdown..."


            if gh api \
              "repos/$GH_REPO/contents/$MARKDOWN_PATH?ref=$MERGE_SHA" \
              >/dev/null; then

              echo "✓ Markdown localizado en main."

            else

              echo "❌ El Markdown NO se encuentra en main."

              exit 1

            fi


            # ======================================================
            # VERIFICAR IMAGEN EN MAIN
            # ======================================================

            echo ""
            echo "Verificando imagen..."


            if gh api \
              "repos/$GH_REPO/contents/$IMAGE_PATH?ref=$MERGE_SHA" \
              >/dev/null; then

              echo "✓ Imagen localizada en main."

            else

              echo "❌ La imagen NO se encuentra en main."

              exit 1

            fi


            # ======================================================
            # PUBLICACIÓN CONFIRMADA
            # ======================================================

            echo ""
            echo "=========================================="
            echo "✓ PUBLICACIÓN CONFIRMADA"
            echo "=========================================="

            echo ""
            echo "PR: #$NUMBER"
            echo "Título: $TITLE"
            echo "Commit: $MERGE_SHA"
            echo "Markdown: OK"
            echo "Imagen: OK"

            echo ""

            echo "⚠ D1 y R2 todavía NO se modifican."

          done < "$TEMP_FILE"
