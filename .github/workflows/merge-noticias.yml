name: Publicar noticias

on:
  schedule:
    - cron: "0 3 * * *" 

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:

  comprobar-noticias:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # BUSCAR Y PUBLICAR PR DE NOTICIAS
      # ==========================================================

      - name: Publicar PR de noticias
        if: steps.hora.outputs.ejecutar == 'true'

        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

        run: |

          # ======================================================
          # MANEJO DE ERRORES
          # ======================================================

          set -e
          set -o pipefail


          echo "========================================"
          echo " PUBLICACIÓN AUTOMÁTICA DE NOTICIAS"
          echo "========================================"

          echo ""
          echo "🕒 Hora de ejecución: $(date)"
          echo ""


          # ======================================================
          # LISTAR PRs ABIERTOS CONTRA MAIN
          # ======================================================

          PRS=$(gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --base main \
            --json number,headRefName,isDraft,title \
            --limit 100)


          if [ "$PRS" = "[]" ]; then

            echo "No hay Pull Requests abiertos."
            exit 0

          fi


          # ======================================================
          # ARCHIVO TEMPORAL
          # ======================================================

          TEMP_FILE=$(mktemp)

          trap 'rm -f "$TEMP_FILE"' EXIT

          echo "$PRS" |
            jq -c '.[]' > "$TEMP_FILE"


          # ======================================================
          # PROCESAR CADA PR
          # ======================================================

          while read -r PR; do

            NUMBER=$(echo "$PR" | jq -r '.number')
            BRANCH=$(echo "$PR" | jq -r '.headRefName')
            IS_DRAFT=$(echo "$PR" | jq -r '.isDraft')
            TITLE=$(echo "$PR" | jq -r '.title')


            echo ""
            echo "----------------------------------------"
            echo "PR #$NUMBER"
            echo "Título: $TITLE"
            echo "Rama: $BRANCH"
            echo "Draft: $IS_DRAFT"
            echo "----------------------------------------"


            # ==================================================
            # SOLO RAMAS noticia/*
            # ==================================================

            if [[ "$BRANCH" != noticia/* ]]; then

              echo "→ Se omite: no es una rama noticia/."

              continue

            fi


            # ==================================================
            # NO PUBLICAR DRAFTS
            # ==================================================

            if [ "$IS_DRAFT" = "true" ]; then

              echo "→ Se omite: el PR está en Draft."

              continue

            fi


            # ==================================================
            # COMPROBAR MERGEABLE
            # ==================================================

            MERGEABLE="UNKNOWN"


            for INTENTO in 1 2 3 4 5; do

              MERGEABLE=$(gh pr view "$NUMBER" \
                --repo "$GH_REPO" \
                --json mergeable \
                --jq '.mergeable')


              echo "Intento $INTENTO/5 → Mergeable: $MERGEABLE"


              if [ "$MERGEABLE" != "UNKNOWN" ]; then

                break

              fi


              if [ "$INTENTO" -lt 5 ]; then

                echo "GitHub todavía no ha calculado la mergeabilidad."
                echo "Esperando 10 segundos..."

                sleep 10

              fi

            done


            echo ""


            # ==================================================
            # SI HAY CONFLICTOS → NO PUBLICAR
            # ==================================================

            if [ "$MERGEABLE" = "CONFLICTING" ]; then

              echo "❌ PR #$NUMBER tiene conflictos."
              echo "→ Se mantiene abierto y no se publica."

              continue

            fi


            # ==================================================
            # SI SIGUE UNKNOWN → NO PUBLICAR
            # ==================================================

            if [ "$MERGEABLE" != "MERGEABLE" ]; then

              echo "⚠ PR #$NUMBER continúa con estado: $MERGEABLE"
              echo "→ Se mantiene abierto y no se publica."

              continue

            fi


            # ==================================================
            # PR PREPARADO
            # ==================================================

            echo "✅ PR #$NUMBER está preparado para publicación."

            echo ""
            echo "→ Iniciando merge del PR #$NUMBER..."


            # ==================================================
            # MERGE REAL
            # ==================================================

            if gh pr merge "$NUMBER" \
              --repo "$GH_REPO" \
              --merge \
              --delete-branch; then

              echo ""
              echo "✅ PR #$NUMBER fusionado correctamente."
              echo "   Rama eliminada: $BRANCH"

            else

              echo ""
              echo "❌ No se ha podido fusionar el PR #$NUMBER."
              echo "→ El PR permanecerá abierto."

              continue

            fi


            echo ""

          done < "$TEMP_FILE"


          # ======================================================
          # FIN
          # ======================================================

          echo ""
          echo "========================================"
          echo " FIN DE LA PUBLICACIÓN"
          echo "========================================"
