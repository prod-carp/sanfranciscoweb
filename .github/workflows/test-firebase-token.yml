
name: Test Firebase Token

on:
  workflow_dispatch:

jobs:
  test-token:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Comprobar FIREBASE_TOKEN
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "ERROR: FIREBASE_TOKEN está vacío o no está disponible."
            exit 1
          fi

          firebase projects:list --token "$FIREBASE_TOKEN"


      - name: Comprobar cuenta de servicio
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -eu

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ERROR: El secreto JSON está vacío o no está disponible."
            exit 1
          fi

          KEY_FILE="$RUNNER_TEMP/firebase-key.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE"

          node -e "
            const fs = require('fs');
            const key = JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8'));
            if (!key.client_email || !key.private_key || !key.project_id) {
              throw new Error('El JSON no contiene los campos esperados.');
            }
            console.log('JSON válido. Tipo:', key.type);
            console.log('Proyecto de la credencial:', key.project_id);
            console.log('Correo de la cuenta:', key.client_email);
          "

          npx --yes firebase-tools projects:list --non-interactive

