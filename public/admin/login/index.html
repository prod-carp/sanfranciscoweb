<!DOCTYPE html>
<html lang="es">

<head><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=1313&amp;path=livereload" data-no-instant defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <title>Acceso privado | Parroquia San Francisco y Santa Clara de Asís</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-box {
      background: white;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
    }

    .login-box h1 {
      margin-top: 0;
      margin-bottom: 10px;
      text-align: center;
      font-size: 1.6rem;
    }

    .login-description {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: #777;
    }

    .login-button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    .login-button:hover {
      background: #222;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 6px;
      background: #fbeaea;
      color: #a33;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2rem;
    }
  </style>
</head>

<body>

  <main class="login-container">

    <section class="login-box">

      <div class="logo">✝️</div>

      <h1>Acceso privado</h1>

      <p class="login-description">
        Área de colaboradores de la parroquia.
      </p>

      <div id="error-message" class="error-message"></div>

      <form id="login-form">

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          type="submit"
          id="login-button"
          class="login-button"
        >
          Entrar
        </button>

      </form>

    </section>

  </main>

  <script type="module" src="/admin/js/login.js"></script>

</body>

</html>
