<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Revisar noticia · Administración</title>

  <link
    rel="stylesheet"
    href="/admin/editor/editor.css"
  >

  <style>

    /* =====================================================
       PÁGINA DE REVISIÓN
       ===================================================== */

    .review-page {

      max-width: 850px;

      margin: 40px auto;

      padding: 0 20px 50px;

    }


    .review-header {

      margin-bottom: 30px;

    }


    .review-header h1 {

      margin-bottom: 8px;

    }


    .review-notice {

      padding: 14px 18px;

      margin-bottom: 30px;

      background: #f5f5f5;

      border-radius: 8px;

      font-size: 0.95rem;

      line-height: 1.5;

    }


    /* =====================================================
       NOTICIA
       ===================================================== */

    .review-article {

      background: white;

    }


.review-article-title {
  margin-bottom: 10px;
  font-size: 2.2rem;
  line-height: 1.2;
  text-align: center;
}


.review-article-subtitle {
  margin-bottom: 25px;
  font-size: 1.15rem;
  line-height: 1.5;
  color: #666;
  text-align: center;
}


.review-article-image {
  width: 637px;
  height: 637px;
  max-width: 100%;
  display: block;
  margin: 0 auto 30px;
  border-radius: 8px;
}


    .review-article-content {

      font-size: 1.05rem;

      line-height: 1.7;

    }


    .review-article-content h2 {

      margin-top: 1.8em;

      margin-bottom: 0.7em;

    }


    .review-article-content h3 {

      margin-top: 1.5em;

      margin-bottom: 0.6em;

    }


    .review-article-content blockquote {

      margin-left: 0;

      padding-left: 18px;

      border-left: 3px solid #ccc;

      color: #555;

    }


    .review-article-content ul,

    .review-article-content ol {

      padding-left: 28px;

    }


    .review-article-content a {

      text-decoration: underline;

    }


    /* =====================================================
       INFORMACIÓN
       ===================================================== */

    .review-meta {

      margin-top: 30px;

      padding-top: 20px;

      border-top: 1px solid #ddd;

      font-size: 0.9rem;

      color: #666;

    }


    /* =====================================================
       BOTONES
       ===================================================== */

    .review-actions {

      display: flex;

      gap: 15px;

      margin-top: 40px;

    }


    .review-actions button {

      flex: 1;

      min-height: 48px;

      padding: 12px 20px;

      border-radius: 6px;

      cursor: pointer;

      font-size: 1rem;

    }


    #modify-button {

      background: white;

      border: 1px solid #aaa;

    }


    #approve-submit-button {

      border: 0;

    }


    @media (max-width: 600px) {

      .review-page {

        margin-top: 25px;

      }


      .review-article-title {

        font-size: 1.7rem;

      }


      .review-actions {

        flex-direction: column;

      }

    }

  </style>

</head>


<body>

  <main class="review-page" id="review-page" style="display:none;">


    <!-- =================================================
         CABECERA
         ================================================= -->

    <header class="review-header">

      <h1>
        Revisar noticia
      </h1>

      <div class="review-notice">

        <strong>Revisa el contenido antes de continuar.</strong>

        <br>

        Esta es una visualización aproximada de cómo
        aparecerá la noticia en la web.

      </div>

    </header>


    <!-- =================================================
         ARTÍCULO
         ================================================= -->

    <article class="review-article">


      <h2
        id="review-title"
        class="review-article-title"
      ></h2>


      <div
        id="review-subtitle"
        class="review-article-subtitle"
      ></div>


      <img
        id="review-image"
        class="review-article-image"
        alt=""
        style="display:none;"
      >


      <div
        id="review-content"
        class="review-article-content"
      ></div>


      <div
        id="review-meta"
        class="review-meta"
      ></div>


    </article>


    <!-- =================================================
         ACCIONES
         ================================================= -->

    <div class="review-actions">

      <button
        type="button"
        id="modify-button"
      >
        ← Modificar
      </button>


      <button
        type="button"
        id="approve-submit-button"
      >
        Enviar para aprobación →
      </button>

    </div>


  </main>


  <script
    type="module"
    src="/admin/editor/review/review.js"
  ></script>

</body>

</html>
